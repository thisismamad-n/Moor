title: Moor Sanctuary
description: "Watch your Moor Agent work: five animated characters wake up when Moor uses their tools, in two illustrated worlds (Olympus by default, the Clearing), in Moor Desktop and the web dashboard, in English or French. The guard barks, with a bubble saying why, on tool and provider errors, silent fallbacks to a backup model, loops (same tool, same arguments, 4 times in a turn), heavy turns, a daily budget overrun and permissions waiting for an answer; a daily journal shows turns, tools, where the work came from, tokens and estimated cost per model hour by hour, with a shareable image of the day and a sped-up replay. Disclosure — observer hooks only (they never block, change or answer anything); records tool names, turn times, platform and scheduled-task names, counters, model names with token counts, the short description Moor gives for a pending approval (never the command) and one-letter event codes with their time for the replay (never messages, arguments, results, error texts, file paths or ids) under plugin-data/moor-sanctuary/, files older than 2 days removed; a hash of each tool call is kept in memory for the current turn only to spot loops; read-only dashboard routes serve that activity and the plugin's own theme and images; cost is estimated with Moor's own agent.usage_pricing module (a private import the validator may warn on); no network calls of its own, no shell commands, no background process, no secrets or .env access, no telemetry and no self-updater; the panorama runs in a sandboxed frame that receives everything by postMessage; Moor Desktop may show native notifications (at most one per kind every 2 minutes); the daily budget is stored by Moor Desktop or the browser."
