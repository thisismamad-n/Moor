description: "CPU, load, free RAM, Linux PSI CPU pressure, active sessions, running Moor processes and round-trip time of the connected Moor server in the Desktop status bar, plus an optional TUI card. Disclosure — the Desktop chip's backend route reads CPU/memory figures via psutil, Linux /proc/pressure/cpu and /proc/meminfo, every process's command line (only per-command Moor process counts are returned) and the server's own loopback /api/status, and reports the server hostname to the Desktop; the optional TUI card, copied by hand into tui-widgets/, runs the same code as a long-lived `python3 -c` child of the TUI and saves its options to <MOOR_HOME>/vitals.json; no third-party network call, no telemetry, no credentials."
