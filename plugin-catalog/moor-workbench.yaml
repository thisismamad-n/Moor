description: The Moor desktop app in your browser. `moor workbench` serves the desktop interface through the Moor dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Moor product. On the first `moor workbench` run and again after each Moor update it runs `npm install --ignore-scripts` (guided by Moor's lockfile) and Vite against your Moor checkout's desktop sources, writing only under ~/.moor/moor-workbench and its own plugin dir (the checkout is only read), and starts `moor dashboard` on loopback when none is running.
