name: litmoor
repo: https://github.com/wjgoarxiv/litmoor
sha: b119ede337cb3ce27bc2a5eec0f68e09ed20f0c6
subdir: packages/litmoor-installer/assets/litmoor-plugin
description: "Adds lit to Moor Agent so a request is planned, built with tests and recorded checks, reviewed, and closed with a handoff note. 40 skills. MIT. Disclosure — adds per-turn workflow context and output marks through Moor hooks and writes its plans, goals, run state and default-on knowledge capture under the workspace's .moor/litmoor/ (capture opt-out: LITMOOR_WIKIFY_CAPTURE=0); /lit-adhd reads recent Moor session titles, asks and tool names from ~/.moor/state.db read-only with the sqlite3 CLI; /lit-hijack downloads the URLs and files you name (web pages, PDFs, X posts via api.fxtwitter.com, git clones of github.com repos and gists) into the workspace; bundled skill runtimes install from their own lockfiles when a skill asks; reads Moor internals read-only (context compressor, config defaults, model metadata, command registry), which can break on a Moor release."
maintainer: wjgoarxiv
tier: community
category: automation
version: "1.0.32"
docs_url: https://github.com/wjgoarxiv/litmoor
capabilities:
  provides_tools:
    - goal_status
    - goal_set
    - goal_add_criterion
    - goal_evidence
    - goal_criterion_status
    - goal_steer
    - goal_status_set
    - goal_checkpoint
    - goal_complete
    - litmoor_work_progress
    - litmoor_knowledge_capture
  provides_hooks:
    - on_session_start
    - pre_llm_call
    - pre_tool_call
    - pre_command
    - post_tool_call
    - transform_tool_result
    - post_api_request
    - subagent_stop
    - transform_llm_output
    - on_session_finalize
    - on_session_reset
  provides_middleware: []
  requires_env: []
