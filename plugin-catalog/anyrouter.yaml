description: AnyRouter — unified model gateway (OpenAI-compatible); /model picker filtered to tool-capable routes, first-party meta-models like anyrouter/moor. Disclosure — sends your prompts and ANYROUTER_API_KEY to anyrouter.dev, a third-party relay that forwards to upstream vendors (OpenAI, Anthropic, Google, xAI, …), on some plans through a shared pool of other members' donated free-tier vendor keys; billed in prepaid AnyRouter credits. anyrouter/moor is AnyRouter's own routing meta-model, not a Moor inc. model. Opt-in ANYROUTER_APP_ATTRIBUTION=1 adds Moor attribution headers.
maintainer: duyet
tier: community
category: models
docs_url: https://github.com/duyet/moor-provider-anyrouter#readme
