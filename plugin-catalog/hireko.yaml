description: "Hireko Recruiter MCP gateway: Cognito authentication, candidate screening interview link creation, and candidate search scoring. Hosted connector: tool arguments are sent to Hireko; an authenticated account is required. Disclosure — sends tool arguments and the user's Hireko bearer token to Hireko's hosted MCP endpoint (an AWS Lambda URL) and recruiter-<tenant>.hireko.ai, POSTs the password (env only) to AWS Cognito, opens a local 127.0.0.1 callback server during browser login, and stores Hireko access/refresh tokens under ~/.HirekoOpenPlugin/credentials."
