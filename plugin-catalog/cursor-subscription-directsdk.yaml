title: Cursor Subscription (DirectSDK)
description: "Experimental model provider that runs Moor turns on your Cursor plan through Cursor's official Python SDK (cursor-sdk), with Cursor Auto offered as `cursor-auto`, and Moor tools registered as native Cursor custom tools: each tool callback parks until Moor has executed the call under its own approvals, then the same Cursor run continues, so parallel calls arrive as one batch and tool rounds keep the model's native context and prompt cache. `moor auth add cursor-subscription-directsdk` runs Cursor's official browser sign-in with Cursor-side persistence off and stores the minted, revocable 90-day user API key in Moor' credential pool (CURSOR_API_KEY also works). Disclosure — sends the full conversation, Moor' system prompt, tool schemas, tool results and user images to Cursor with your key; installs cursor-sdk 1.3.1 from PyPI (hash-pinned, about 200 MB, includes Cursor's bundled node bridge) into the plugin's own .venv and runs it as a long-lived sidecar (one per Moor profile) that starts that bridge on loopback, with an environment rebuilt from an allowlist (PATH, HOME, locale, TLS/proxy, display variables for sign-in, its own CURSOR_SUBSCRIPTION_*), so no other Moor keys or tokens reach Cursor's code; Cursor's built-in tools are disabled (tools=[\"mcp\"]) and agents get no MCP servers or Cursor settings sources, and local Cursor agent state lives under $MOOR_HOME/cache/cursor-subscription-directsdk and is deleted when each conversation closes."
maintainer: arnavprabhu
tier: community
category: models
requires_moor: ">=0.22.6"
docs_url: https://github.com/arnavprabhu/CursorProviderMoor#readme
version: "0.3.1"
readme: true
platforms:
  - linux
  - macos
known_issues:
  - "Cursor's own agent harness prompt (about 10-15K tokens) precedes Moor' system prompt, which is delivered in the first user message; the SDK has no system-prompt override."
  - "Cursor reports usage per run, not per model call, so per-call usage and cost show n/a; spend appears on the Cursor dashboard under the SDK tag."
  - "Images inside tool results reach the model as [image] text; temperature, top_p, stop and max_tokens are ignored."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
