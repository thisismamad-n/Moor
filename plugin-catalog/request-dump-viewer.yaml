sha: 3d94c6da86b0e16107be569e6d91bde772a4e8a3
version: "0.4.4"
description: "Inspect local Moor request dumps, messages, tool calls, schemas, and diffs in a dashboard tab. Disclosure — reads matching request dumps and Moor state.db read-only; its capture switch writes only plugin-data/request-dump-viewer state and sets or clears MOOR_DUMP_REQUESTS in the gateway process, which is process-wide, so in a multi-profile gateway capture also records requests handled for other profiles while it is on. No network, shell, telemetry, or credential-store access."
maintainer: TDV Alinsa
tier: community
category: desktop
requires_moor: ">=0.21.5"
docs_url: https://github.com/alinsavix/moor-request-dump-viewer/blob/3d94c6da86b0e16107be569e6d91bde772a4e8a3/README.md
