name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Moor — traces conversations, LLM calls, and tool usage. Opt-in via `moor plugins enable observability/langfuse` or `moor tools → Langfuse Observability`."
author: Moor inc.
requires_env:
  - MOOR_LANGFUSE_PUBLIC_KEY
  - MOOR_LANGFUSE_SECRET_KEY
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_end
  - subagent_start
  - subagent_stop
